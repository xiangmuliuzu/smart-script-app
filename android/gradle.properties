org.gradle.jvmargs=-Xmx4G
android.useAndroidX=true
android.enableJetifier=true
android.overridePathCheck=true

# H-05：minSdk 19（Flutter 3.19.6 默认）下方法数已超 64K，需 multidex。
# 置位后由 Flutter 官方 Gradle 插件统一完成三件事（见 flutter_tools/gradle）：
#   1) defaultConfig.multiDexEnabled = true
#   2) manifest 占位符 applicationName -> io.flutter.app.FlutterMultiDexApplication
#   3) 依赖 androidx.multidex:multidex:2.0.1 + release keepfile
# 该配置对所有构建路径生效（flutter build apk / flutter test integration_test），
# 且不改变 minSdkVersion（仍为 19）。
multidex-enabled=true
